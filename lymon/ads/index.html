<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#DBDBDB;font-family:'Inter',sans-serif;}
  .icon{width:24px;height:24px;}
</style>
</helmet>

<div style="display:flex;justify-content:center;padding:24px 0 80px;">
<div style="width:470px;max-width:100%;background:#fff;">

  <div style="position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #EFEFEF;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;">
    <div style="font-family:Inter,sans-serif;font-weight:800;font-size:20px;color:#123B1E;">Instagram Preview</div>
    <div style="display:flex;gap:16px;">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#123B1E" stroke-width="1.8"><path d="M4 4h16v13H8l-4 4V4z"/></svg>
    </div>
  </div>

  <div style="padding:20px 16px 4px;font-family:Inter,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.06em;color:#8E8E8E;text-transform:uppercase;">Posts</div>

  <sc-for list="{{ posts }}" as="p" hint-placeholder-count="10">
    <div style="border-bottom:8px solid #FAFAFA;">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;">
        <div style="width:34px;height:34px;border-radius:50%;background:#123B1E;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
          <img src="uploads/icon.svg" style="width:20px;height:20px;">
        </div>
        <div style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:#123B1E;">lymon</div>
      </div>
      <div onClick="{{ p.open }}" style="position:relative;aspect-ratio:4/5;overflow:hidden;cursor:pointer;background:#123B1E;">
        <img src="{{ p.img }}" style="width:100%;height:100%;object-fit:cover;object-position:top center;">
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;">
        <div style="display:flex;gap:16px;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#123B1E" stroke-width="1.8"><path d="M20.8 8.6c0 4.4-8.8 10.4-8.8 10.4S3.2 13 3.2 8.6a4.9 4.9 0 0 1 8.8-2.9 4.9 4.9 0 0 1 8.8 2.9z"/></svg>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#123B1E" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.4L3 20l1.2-5.3A8.5 8.5 0 1 1 21 11.5z"/></svg>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#123B1E" stroke-width="1.8"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </div>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#123B1E" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      </div>
      <div style="padding:8px 16px 16px;">
        <div style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:#123B1E;">{{ p.likes }} likes</div>
        <div style="font-family:Inter,sans-serif;font-size:14px;color:#123B1E;line-height:1.45;margin-top:6px;"><span style="font-weight:700;">lymon</span> {{ p.caption }}</div>
        <div style="font-family:Inter,sans-serif;font-size:13px;color:#8E8E8E;margin-top:6px;">{{ p.time }}</div>
      </div>
    </div>
  </sc-for>


</div>
</div>

<sc-if value="{{ showImageLightbox }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeLightbox }}" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:20;display:flex;align-items:center;justify-content:center;">
    <img src="{{ lightboxImg }}" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;">
    <div onClick="{{ prev }}" style="position:absolute;left:24px;top:50%;transform:translateY(-50%);color:#fff;font-size:32px;cursor:pointer;padding:12px;">‹</div>
    <div onClick="{{ next }}" style="position:absolute;right:24px;top:50%;transform:translateY(-50%);color:#fff;font-size:32px;cursor:pointer;padding:12px;">›</div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
const POSTS = [
  { img: 'screenshots/post-1.png', likes: '482', caption: "You shouldn't need 5 tools to run today's operations. 💬 Comment ROTA for early access", time: '1 DAY AGO' },
  { img: 'screenshots/post-2.png', likes: '311', caption: 'You check multiple apps just to keep the business running smoothly. 💬 Comment MORNING for early access', time: '2 DAYS AGO' },
  { img: 'screenshots/post-3.png', likes: '267', caption: "UK hospitality pays 20% VAT. France, Spain, Italy and Germany average 10% or less. Half our burden, sometimes a third. That gap is why Tom Kerridge's #VATsTheProblem campaign picked up over 100,000 signatures in three days. Policy change matters, but operators aren't waiting on government, they're finding every way to run leaner with what they've already got. Lymon is one of those ways.", time: '3 DAYS AGO' },
  { img: 'screenshots/post-4.png', likes: '298', caption: 'Walking into another café, what a Tuesday on Portobello Road looks like.', time: '4 DAYS AGO' },
  { img: 'screenshots/post-5.png', likes: '356', caption: 'Your Rota, handled. 💬 Comment DEMO for early access', time: '5 DAYS AGO' },
  { img: 'screenshots/post-6.png', likes: '520', caption: "170,000 jobs cut. 71,000 vacancies still open. Since the October 2024 Budget, the sector has shed 170,000 jobs. Yet 71,000 roles are still sitting open. That's not a shortage of people. It's operators cutting back while the ones left standing get stretched across cover nobody planned for. Every venue I walk into is doing more with fewer hands. Lymon exists because you can't hire your way out of that. You have to organise your way out of it.", time: '6 DAYS AGO' },
  { img: 'screenshots/post-7.png', likes: '289', caption: 'Stop checking five apps. Check one. Every signal from the floor, surfaced, not buried in messages. 💬 Comment ACCESS for early access', time: '1 WEEK AGO' },
  { img: 'screenshots/post-8.png', likes: '404', caption: "Your café is already running. 💬 Comment ACTION for early access", time: '1 WEEK AGO' },
  { img: 'screenshots/post-9.png', likes: '378', caption: "Tomorrow's rota is already organised. 💬 Comment TOOLS for early access", time: '2 WEEKS AGO' },
  { img: 'screenshots/post-10.png', likes: '445', caption: "52% of hospitality staff leave within a year. CIPD puts hospitality attrition at 52%, against a UK average of 34%. And 40% of leavers just move to the café down the road, chasing better hours or a manager with time for them. We built Lymon's rota tools because retention isn't a hiring problem, it's a Tuesday-shift problem. Fix the day-to-day, and the yearly number takes care of itself.", time: '2 WEEKS AGO' },
  { img: 'screenshots/post-11.png', likes: '332', caption: "Your team, onboarded and trained in one place. 💬 Comment TEAM for early access", time: '3 WEEKS AGO' },
];

class Component extends DCLogic {
  state = { lightbox: null };

  openPost = (i) => this.setState({ lightbox: { index: i } });
  closeLightbox = () => this.setState({ lightbox: null });
  next = () => this.setState(s => s.lightbox ? { lightbox: { index: (s.lightbox.index + 1) % POSTS.length } } : s);
  prev = () => this.setState(s => s.lightbox ? { lightbox: { index: (s.lightbox.index - 1 + POSTS.length) % POSTS.length } } : s);

  renderVals() {
    const { lightbox } = this.state;
    const posts = POSTS.map((p, i) => ({ ...p, open: () => this.openPost(i) }));
    return {
      posts,
      showImageLightbox: !!lightbox,
      lightboxImg: lightbox ? POSTS[lightbox.index].img : '',
      closeLightbox: this.closeLightbox,
      next: this.next,
      prev: this.prev,
    };
  }
}

</script>
</body>
</html>
